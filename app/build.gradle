plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.macro.visionpaint'
    compileSdk 34

    defaultConfig {
        applicationId "com.macro.visionpaint"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"

        // Deixa o .apk menor (só celulares ARM, que são quase todos).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // Chave fixa: todas as versões ficam com a mesma assinatura e uma atualiza a outra
    // por cima, sem apagar as imagens e os ajustes salvos no celular.
    signingConfigs {
        debug {
            def ks = rootProject.file('signing/debug.keystore')
            if (ks.exists()) {
                storeFile ks
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.opencv:opencv:4.9.0'
}
